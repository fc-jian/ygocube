# YGO Cube unified configuration (dev_docs/05 §9)
# Copy to the repo root as config.yaml (or set CONFIG_FILE to another path).
admin:
  # super admin: can view/manage all tournaments and card pools
  super_token: "change-me-super-token"
srvpro:
  url: "http://127.0.0.1:7922"
  # 玩家端显示的对局服务器地址（公网部署填公网 IP，如 "39.96.220.91"）
  host: "127.0.0.1"
  api_key: "cube-test-key"
server:
  port: 3001
  db_path: "data/cube.sqlite"
  cards_cdb: "srvpro/ygopro/cards.cdb"
  # Browser-visible card names are loaded from this exact-code mapping. Each
  # record uses sc_name, md_name, jp_name, cn_name, then en_name (ignoring blank values);
  # if all are blank, the exact cards.cdb texts.name is the final fallback.
  card_names_json: "assets/ygocdb_cards.json"
  strings_conf: "srvpro/ygopro/strings.conf"
  allowed_origins: ["http://localhost:3000", "http://127.0.0.1:3000"]
  # 仅本机临时开发可开启；生产环境必须使用非占位且互不相同的管理 token。
  allow_insecure_defaults: false
pics:
  # 服务端本地卡图根目录（可选，真实场景留空）：卡图只存在于玩家本地，由前端
  # showDirectoryPicker 显式授权后直接读取；留空则服务端代理 404、前端回退空白卡。
  ygopro_root: ""
  # 低清 avif 缩略图目录（服务端保存，GET /pics/:code.avif）：本地绑定失败时前端
  # 先回退到这里，再尝试 ygopro_root 原图代理，最后才是空白卡。
  avif_dir: "assets/pics_avif"
